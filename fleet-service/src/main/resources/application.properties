spring.application.name=fleet-service
server.port=8082

spring.cloud.stream.kafka.binder.brokers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.cloud.function.definition=driverAssigned

spring.cloud.stream.bindings.driverAssigned-in-0.destination=dispatch.driver-assigned
spring.cloud.stream.bindings.driverAssigned-in-0.group=fleet-service
spring.cloud.stream.bindings.driverAssigned-in-0.content-type=application/json
