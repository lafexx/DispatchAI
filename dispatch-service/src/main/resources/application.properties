spring.application.name=dispatch-service
server.port=8083

fleet-service.base-url=${FLEET_SERVICE_BASE_URL:http://localhost:8082}
delivery-service.base-url=${DELIVERY_SERVICE_BASE_URL:http://localhost:8081}

spring.cloud.stream.kafka.binder.brokers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.cloud.stream.output-bindings=driverAssigned-out-0

spring.cloud.stream.bindings.driverAssigned-out-0.destination=dispatch.driver-assigned
spring.cloud.stream.bindings.driverAssigned-out-0.content-type=application/json

spring.cloud.function.definition=deliveryCompleted;deliveryCancelled;assignmentRejected

spring.cloud.stream.bindings.deliveryCompleted-in-0.destination=delivery.completed
spring.cloud.stream.bindings.deliveryCompleted-in-0.group=dispatch-service
spring.cloud.stream.bindings.deliveryCompleted-in-0.content-type=application/json

spring.cloud.stream.bindings.deliveryCancelled-in-0.destination=delivery.cancelled
spring.cloud.stream.bindings.deliveryCancelled-in-0.group=dispatch-service
spring.cloud.stream.bindings.deliveryCancelled-in-0.content-type=application/json

spring.cloud.stream.bindings.assignmentRejected-in-0.destination=delivery.assignment-rejected
spring.cloud.stream.bindings.assignmentRejected-in-0.group=dispatch-service
spring.cloud.stream.bindings.assignmentRejected-in-0.content-type=application/json
dispatch.reservation.sweep-ms=5000


# Business records, inbox and outbox share the same persistent database.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/dispatchdb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Commit offsets only after successful handling or successful dead-letter recovery.
spring.cloud.stream.default.consumer.maxAttempts=5
spring.cloud.stream.default.consumer.backOffInitialInterval=1000
spring.cloud.stream.default.consumer.backOffMultiplier=2.0
spring.cloud.stream.default.consumer.backOffMaxInterval=10000
spring.cloud.stream.kafka.default.consumer.ackMode=RECORD
spring.cloud.stream.kafka.default.consumer.configuration.enable.auto.commit=false
spring.cloud.stream.kafka.default.consumer.enableDlq=true

# An acknowledged synchronous send is required before an outbox row is marked published.
spring.cloud.stream.kafka.default.producer.sync=true
spring.cloud.stream.kafka.default.producer.sendTimeoutExpression=10000
spring.cloud.stream.kafka.default.producer.messageKeyExpression=headers['messageKey']
spring.cloud.stream.default.producer.errorChannelEnabled=false
spring.cloud.stream.kafka.binder.producerProperties.acks=all
spring.cloud.stream.kafka.binder.producerProperties.enable.idempotence=true
spring.cloud.stream.kafka.binder.producerProperties.max.block.ms=5000
spring.cloud.stream.kafka.binder.producerProperties.request.timeout.ms=5000
spring.cloud.stream.kafka.binder.producerProperties.delivery.timeout.ms=10000
messaging.outbox.enabled=${MESSAGING_OUTBOX_ENABLED:true}
messaging.outbox.poll-ms=1000

# Keep reservation/compensation maintenance running while a relay waits for Kafka.
spring.task.scheduling.pool.size=2
