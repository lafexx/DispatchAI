spring.application.name=customer-service
server.port=8084

spring.datasource.url=jdbc:h2:mem:customerdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

spring.cloud.stream.kafka.binder.brokers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.cloud.stream.default.contentType=application/json

#------------------------
# INPUT BINDINGS
#------------------------
spring.cloud.function.definition=\
driverAssigned;\
deliveryStarted;\
deliveryCompleted;\
deliveryCancelled;\
deliveryDelayed

spring.cloud.stream.bindings.driverAssigned-in-0.destination=dispatch.driver-assigned
spring.cloud.stream.bindings.driverAssigned-in-0.group=customer-service

spring.cloud.stream.bindings.deliveryStarted-in-0.destination=delivery.started
spring.cloud.stream.bindings.deliveryStarted-in-0.group=customer-service

spring.cloud.stream.bindings.deliveryCompleted-in-0.destination=delivery.completed
spring.cloud.stream.bindings.deliveryCompleted-in-0.group=customer-service

spring.cloud.stream.bindings.deliveryCancelled-in-0.destination=delivery.cancelled
spring.cloud.stream.bindings.deliveryCancelled-in-0.group=customer-service

spring.cloud.stream.bindings.deliveryDelayed-in-0.destination=delivery.delayed
spring.cloud.stream.bindings.deliveryDelayed-in-0.group=customer-service
