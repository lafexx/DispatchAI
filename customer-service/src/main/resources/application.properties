spring.application.name=customer-service
server.port=8084


spring.cloud.stream.kafka.binder.brokers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.cloud.stream.default.contentType=application/json

#------------------------
# INPUT BINDINGS
#------------------------
spring.cloud.function.definition=\
driverAssigned;\
deliveryStarted;\
deliveryCompleted;\
deliveryCancelled;\
deliveryDelayed

spring.cloud.stream.bindings.driverAssigned-in-0.destination=delivery.assigned
spring.cloud.stream.bindings.driverAssigned-in-0.group=customer-service

spring.cloud.stream.bindings.deliveryStarted-in-0.destination=delivery.started
spring.cloud.stream.bindings.deliveryStarted-in-0.group=customer-service

spring.cloud.stream.bindings.deliveryCompleted-in-0.destination=delivery.completed
spring.cloud.stream.bindings.deliveryCompleted-in-0.group=customer-service

spring.cloud.stream.bindings.deliveryCancelled-in-0.destination=delivery.cancelled
spring.cloud.stream.bindings.deliveryCancelled-in-0.group=customer-service

spring.cloud.stream.bindings.deliveryDelayed-in-0.destination=delivery.delayed
spring.cloud.stream.bindings.deliveryDelayed-in-0.group=customer-service


# Business records, inbox and outbox share the same persistent database.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/customerdb;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Commit offsets only after successful handling or successful dead-letter recovery.
spring.cloud.stream.default.consumer.maxAttempts=5
spring.cloud.stream.default.consumer.backOffInitialInterval=1000
spring.cloud.stream.default.consumer.backOffMultiplier=2.0
spring.cloud.stream.default.consumer.backOffMaxInterval=10000
spring.cloud.stream.kafka.default.consumer.ackMode=RECORD
spring.cloud.stream.kafka.default.consumer.configuration.enable.auto.commit=false
spring.cloud.stream.kafka.default.consumer.enableDlq=true
