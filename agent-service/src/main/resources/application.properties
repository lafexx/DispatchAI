spring.application.name=agent-service
server.port=8086

langchain4j.ollama.chat-model.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
langchain4j.ollama.chat-model.model-name=llama3.1:8b
langchain4j.ollama.chat-model.temperature=0.1
langchain4j.ollama.chat-model.timeout=60s

langchain4j.ollama.chat-model.log-requests=true
langchain4j.ollama.chat-model.log-responses=true

services.analytics.base-url=${ANALYTICS_SERVICE_URL:http://localhost:8085}
services.delivery.base-url=${DELIVERY_SERVICE_URL:http://localhost:8081}
services.fleet.base-url=${FLEET_SERVICE_URL:http://localhost:8082}
