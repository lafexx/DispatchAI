spring.application.name=analytics-service
server.port=8085

spring.cloud.stream.kafka.streams.binder.brokers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.cloud.function.definition=deliveryCreatedAnalytics

spring.cloud.stream.bindings.deliveryCreatedAnalytics-in-0.destination=delivery.created
spring.cloud.stream.bindings.deliveryCreatedAnalytics-out-0.destination=analytics.delivery-state

spring.cloud.stream.kafka.streams.bindings.deliveryCreatedAnalytics-in-0.consumer.valueSerde=org.springframework.kafka.support.serializer.JsonSerde
spring.cloud.stream.kafka.streams.bindings.deliveryCreatedAnalytics-out-0.producer.valueSerde=org.springframework.kafka.support.serializer.JsonSerde
