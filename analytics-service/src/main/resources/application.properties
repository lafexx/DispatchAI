spring.application.name=analytics-service
server.port=8085

spring.cloud.stream.kafka.streams.binder.brokers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.cloud.stream.kafka.streams.binder.configuration.commit.interval.ms=500
spring.cloud.stream.default.contentType=application/json
spring.cloud.function.definition=deliveryCreatedAnalytics;driverAssignedAnalytics;deliveryStartedAnalytics;deliveryDelayedAnalytics;deliveryCompletedAnalytics;deliveryCancelledAnalytics;deliveryStateAggregator


# --------------------------------------------------
# KAFKA STREAMS APPLICATION IDS
# --------------------------------------------------

spring.cloud.stream.kafka.streams.binder.functions.deliveryCreatedAnalytics.applicationId=analytics-delivery-created
spring.cloud.stream.kafka.streams.binder.functions.driverAssignedAnalytics.applicationId=analytics-driver-assigned
spring.cloud.stream.kafka.streams.binder.functions.deliveryStartedAnalytics.applicationId=analytics-delivery-started
spring.cloud.stream.kafka.streams.binder.functions.deliveryDelayedAnalytics.applicationId=analytics-delivery-delayed
spring.cloud.stream.kafka.streams.binder.functions.deliveryCompletedAnalytics.applicationId=analytics-delivery-completed
spring.cloud.stream.kafka.streams.binder.functions.deliveryCancelledAnalytics.applicationId=analytics-delivery-cancelled
spring.cloud.stream.kafka.streams.binder.functions.deliveryStateAggregator.applicationId=analytics-delivery-state-aggregator


# --------------------------------------------------
# INPUT BINDINGS
# --------------------------------------------------

spring.cloud.stream.bindings.deliveryCreatedAnalytics-in-0.destination=delivery.created
spring.cloud.stream.bindings.deliveryCreatedAnalytics-in-0.consumer.useNativeDecoding=false

spring.cloud.stream.bindings.driverAssignedAnalytics-in-0.destination=dispatch.driver-assigned
spring.cloud.stream.bindings.driverAssignedAnalytics-in-0.consumer.useNativeDecoding=false

spring.cloud.stream.bindings.deliveryStartedAnalytics-in-0.destination=delivery.started
spring.cloud.stream.bindings.deliveryStartedAnalytics-in-0.consumer.useNativeDecoding=false

spring.cloud.stream.bindings.deliveryDelayedAnalytics-in-0.destination=delivery.delayed
spring.cloud.stream.bindings.deliveryDelayedAnalytics-in-0.consumer.useNativeDecoding=false

spring.cloud.stream.bindings.deliveryCompletedAnalytics-in-0.destination=delivery.completed
spring.cloud.stream.bindings.deliveryCompletedAnalytics-in-0.consumer.useNativeDecoding=false

spring.cloud.stream.bindings.deliveryCancelledAnalytics-in-0.destination=delivery.cancelled
spring.cloud.stream.bindings.deliveryCancelledAnalytics-in-0.consumer.useNativeDecoding=false

spring.cloud.stream.bindings.deliveryStateAggregator-in-0.destination=analytics.delivery-updates
spring.cloud.stream.bindings.deliveryStateAggregator-in-0.consumer.useNativeDecoding=false


# --------------------------------------------------
# OUTPUT BINDINGS
# --------------------------------------------------

spring.cloud.stream.bindings.deliveryCreatedAnalytics-out-0.destination=analytics.delivery-updates
spring.cloud.stream.bindings.deliveryCreatedAnalytics-out-0.producer.useNativeEncoding=false

spring.cloud.stream.bindings.driverAssignedAnalytics-out-0.destination=analytics.delivery-updates
spring.cloud.stream.bindings.driverAssignedAnalytics-out-0.producer.useNativeEncoding=false

spring.cloud.stream.bindings.deliveryStartedAnalytics-out-0.destination=analytics.delivery-updates
spring.cloud.stream.bindings.deliveryStartedAnalytics-out-0.producer.useNativeEncoding=false

spring.cloud.stream.bindings.deliveryDelayedAnalytics-out-0.destination=analytics.delivery-updates
spring.cloud.stream.bindings.deliveryDelayedAnalytics-out-0.producer.useNativeEncoding=false

spring.cloud.stream.bindings.deliveryCompletedAnalytics-out-0.destination=analytics.delivery-updates
spring.cloud.stream.bindings.deliveryCompletedAnalytics-out-0.producer.useNativeEncoding=false

spring.cloud.stream.bindings.deliveryCancelledAnalytics-out-0.destination=analytics.delivery-updates
spring.cloud.stream.bindings.deliveryCancelledAnalytics-out-0.producer.useNativeEncoding=false
