services:
  broker:
    image: apache/kafka:4.3.1
    hostname: broker
    container_name: dispatchai-broker

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_ADVERTISED_LISTENERS: >
        PLAINTEXT_HOST://localhost:9092,
        PLAINTEXT://broker:19092

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093

      KAFKA_LISTENERS: >
        CONTROLLER://:29093,
        PLAINTEXT_HOST://:9092,
        PLAINTEXT://:19092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs


  delivery-service:
    build:
      context: ./delivery-service

    container_name: dispatchai-delivery

    ports:
      - "8081:8081"

    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:19092

    depends_on:
      - broker


  fleet-service:
    build:
      context: ./fleet-service

    container_name: dispatchai-fleet

    ports:
      - "8082:8082"

    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:19092

    depends_on:
      - broker


  dispatch-service:
    build:
      context: ./dispatch-service

    container_name: dispatchai-dispatch

    ports:
      - "8083:8083"

    environment:
      FLEET_SERVICE_BASE_URL: http://fleet-service:8082
      DELIVERY_SERVICE_BASE_URL: http://delivery-service:8081

      KAFKA_BOOTSTRAP_SERVERS: broker:19092

    depends_on:
      - delivery-service
      - fleet-service
      - broker


  customer-service:
    build:
      context: ./customer-service

    container_name: dispatchai-customer

    ports:
      - "8084:8084"

    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:19092

    depends_on:
      - broker


  analytics-service:
    build:
      context: ./analytics-service

    container_name: dispatchai-analytics

    ports:
      - "8085:8085"

    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:19092

    depends_on:
      - broker


  agent-service:
    build:
      context: ./agent-service

    container_name: dispatchai-agent

    ports:
      - "8086:8086"

    environment:
      DELIVERY_SERVICE_BASE_URL: http://delivery-service:8081
      FLEET_SERVICE_BASE_URL: http://fleet-service:8082
      DISPATCH_SERVICE_BASE_URL: http://dispatch-service:8083

      KAFKA_BOOTSTRAP_SERVERS: broker:19092

    depends_on:
      - delivery-service
      - fleet-service
      - dispatch-service
      - broker

  tools:
    image: alpine:3.22
    profiles:
      - tools
    command: sleep infinity
